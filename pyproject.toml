[project]
name = "ui-ux-design"
version = "0.1.0"
description = "Anti-AI-UI Skills System — MCP tools + Skills for structured, quality UI generation"
readme = "README.md"
authors = [
    { name = "snn206", email = "tranxuanson2k61810@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "numpy>=1.24",
    "click>=8.0",
    "rich>=13.0",
    "colormath>=3.0",
    "svgwrite>=1.4",
    "pydantic>=2.0",
    "platformdirs>=4.0",
    "httpx>=0.27",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy"]

[project.scripts]
ui-mcp = "ui_ux_design.cli.main:main"

[project.urls]
Homepage = "https://github.com/snn206/ui-ux-design"
Repository = "https://github.com/snn206/ui-ux-design"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
